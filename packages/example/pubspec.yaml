name: example
description: "Minimal Flutter Mana example with all 16 kits and live English / Chinese switching."
publish_to: none
version: 2.0.0-rc.1+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  flutter_mana:
    path: ../core
  flutter_mana_kits:
    path: ../kits
  dio: ^5.11.1
  logger: ^2.8.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
