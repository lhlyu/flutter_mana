name: 发布工具包 flutter_mana_kits

on:
  push:
    tags:
      - 'flutter_mana_kits-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: publish-kits-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.50.0'
  PUB_HOSTED_URL: https://pub.dev

jobs:
  validate:
    name: 校验并测试工具包
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      should_publish: ${{ steps.status.outputs.should_publish }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 校验发布 tag、包版本和更新日志
        run: dart scripts/release.dart check packages/kits
      - name: 安装项目依赖
        run: flutter pub get
      - name: 静态分析发布脚本
        run: dart analyze scripts
      - name: 测试发布脚本
        run: dart scripts/release_test.dart
      - name: 静态分析工具包
        run: flutter analyze
        working-directory: packages/kits
      - name: 测试工具包
        run: flutter test
        working-directory: packages/kits
      - name: 检查当前版本是否已经发布
        id: status
        run: dart scripts/release.dart status packages/kits
      - name: 等待核心包在 pub.dev 可用
        if: steps.status.outputs.should_publish == 'true'
        run: dart scripts/release.dart wait packages/core

  publish:
    name: 使用官方工作流发布工具包
    needs: validate
    if: needs.validate.outputs.should_publish == 'true'
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
    with:
      environment: pub.dev
      working-directory: packages/kits
      sdk: '3.14.0'
      use-flutter: true
